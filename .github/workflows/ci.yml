name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and bundle (macOS ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: aarch64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: make test
      - run: make zip
